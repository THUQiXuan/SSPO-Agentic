# Selection-aware comparison, shared settings. Arm: Dr. GRPO pass@1 (Liu et al. 2025, arXiv 2503.20783):
# A_i = g_i - mean(g) on the hidden-test reward of the representative program, constant loss normalizer.
name: sel_drgrpo
sel_arm: drgrpo
steps: 30
tasks_per_step: 16
group_size: 16          # n = 16 runs per problem (k = 8 subsets: C(16, 8) = 12,870)
k_deploy: 8
alpha: 0.7
lr: 1.0e-5              # LoRA learning rate (10x the full-fine-tuning 1e-6 of the second version)
clip_low: 0.2
clip_high: 0.28
ppo_mini_batches: 2
loss_norm_tokens: 4096
max_grad_norm: 1.0
save_every: 5
