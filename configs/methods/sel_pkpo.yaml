# Selection-aware comparison. Arm: pass@k with the PKPO binary closed form and leave-one-out baseline (Walder & Karkhanis 2025,
# arXiv 2505.15201): A_i = (k/n)(A_i^cov - b_i^cov) on f = g, k = 8. Other settings as sel_drgrpo.
name: sel_pkpo
sel_arm: pkpo
steps: 30
tasks_per_step: 16
group_size: 16          # n = 16 runs per problem (k = 8 subsets: C(16, 8) = 12,870)
k_deploy: 8
alpha: 0.7
lr: 1.0e-5              # LoRA learning rate (10x the full-fine-tuning 1e-6 of the second version)
clip_low: 0.2
clip_high: 0.28
ppo_mini_batches: 2
loss_norm_tokens: 4096
max_grad_norm: 1.0
save_every: 5
